[package]
name = "pilgrim-core"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Pilgrim Core – deterministic enforcement engine for Amethyst"

[lib]
name = "pilgrim_core"
crate-type = ["rlib"]

[features]
default = ["std"]
std = []

[dependencies]
ed25519-dalek = { version = "2", default-features = false }
hkdf = "0.12"
sha2 = "0.10"
