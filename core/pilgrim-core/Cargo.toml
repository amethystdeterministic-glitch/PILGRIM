[package]
name = "pilgrim-core"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Pilgrim Core — deterministic enforcement engine for Amethyst"

[lib]
name = "pilgrim_core"
crate-type = ["rlib"]

[dependencies]
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
