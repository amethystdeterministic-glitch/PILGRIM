<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DOTS — Deterministic vs Probabilistic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0b0b10;
      color: #e9e9f3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow: hidden;
    }
    .label {
      position: fixed;
      top: 14px;
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .left { left: 20px; color: #ff8c8c; }
    .right { right: 20px; color: #9f8cff; }
    .hint {
      position: fixed;
      bottom: 14px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      opacity: 0.6;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="label left">Probabilistic</div>
  <div class="label right">Deterministic</div>
  <div class="hint">Tap either side to disturb the system</div>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const MID = () => canvas.width / 2;

function makeDots(n, deterministic) {
  return Array.from({ length: n }, () => ({
    x: deterministic ? MID() + Math.random() * (canvas.width/2) : Math.random() * MID(),
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.6,
    vy: (Math.random() - 0.5) * 0.6,
    d: deterministic
  }));
}

let dots = [
  ...makeDots(120, false),
  ...makeDots(120, true)
];

canvas.addEventListener("pointerdown", e => {
  dots.forEach(d => {
    if ((e.clientX < MID()) === !d.d) {
      d.vx += (Math.random() - 0.5) * 4;
      d.vy += (Math.random() - 0.5) * 4;
    }
  });
});

function step() {
  ctx.fillStyle = "#0b0b10";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const d of dots) {
    d.x += d.vx;
    d.y += d.vy;

    if (d.d) {
      // Deterministic correction
      if (d.x < MID()) d.x = MID();
      if (d.x > canvas.width) d.x = canvas.width;
      if (d.y < 0) d.y = 0;
      if (d.y > canvas.height) d.y = canvas.height;
    } else {
      // Probabilistic drift
      if (d.x < 0 || d.x > MID()) d.vx *= -1;
      if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
    }

    ctx.fillStyle = d.d ? "#9f8cff" : "#ff8c8c";
    ctx.beginPath();
    ctx.arc(d.x, d.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  requestAnimationFrame(step);
}
step();
</script>
</body>
</html>
