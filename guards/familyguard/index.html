<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FamilyGuard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: system-ui, sans-serif;
      background: #0F0F23;
      color: #E5E7EB;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    ul { margin-left: 1.5rem; }
    li { margin-bottom: .6rem; }
    .guard {
      margin-top: 2rem;
      padding: 1.5rem;
      border-left: 4px solid #10B981;
      background: rgba(30,27,75,.6);
    }
  </style>
</head>
<body>
  <h1>FamilyGuard</h1>
  <p>FamilyGuard is a deterministic protection layer designed to enforce safe, bounded environments.</p>

  <div class="guard">
    <strong>Enforces:</strong>
    <ul>
      <li>Application boundaries</li>
      <li>Content limits</li>
      <li>Execution visibility</li>
      <li>No hidden state changes</li>
    </ul>
  </div>

  <p>This guard is inactive until authorised.</p>
</body>
</html>
