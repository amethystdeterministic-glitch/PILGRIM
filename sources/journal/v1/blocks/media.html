<section class="source-block media-block">
  <h2>Media</h2>

  <!-- Image Example -->
  <figure>
    <img src="./media/example-image.jpg" alt="Example image" />
    <figcaption>Static image served from this Source.</figcaption>
  </figure>

  <!-- Video Example -->

  </figure>
</section>
