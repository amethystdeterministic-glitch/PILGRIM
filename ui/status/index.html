<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Amethyst Deterministic — Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background: #0b0f14;
      color: #e6e6e6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      margin: 0 auto;
      border: 1px solid #2a2f3a;
      padding: 24px;
      border-radius: 12px;
      background: #111622;
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      letter-spacing: 0.5px;
    }
    .ok {
      color: #4ade80;
      font-weight: 600;
    }
    pre {
      background: #0b0f14;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid #1f2430;
    }
    .footer {
      margin-top: 16px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>AMETHYST DETERMINISTIC LTD</h1>

    <p class="ok">STATUS: VALIDATED</p>

    <p>
      Deterministic Enforcement Stack is online.
      This interface is a read-only authority surface.
    </p>

    <pre id="status">Loading…</pre>

    <div class="footer">
      No UI logic. No tracking. No cookies. No inference.<br>
      Authority only.
    </div>
  </div>

  <script>
    fetch("http://127.0.0.1:4000/status-json")
      .then(r => r.json())
      .then(data => {
        document.getElementById("status").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById("status").textContent =
          "Backend not reachable (expected in Termux sandbox).";
      });
  </script>
</body>
</html>
