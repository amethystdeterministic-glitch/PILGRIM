<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  role="img"
  aria-label="Amethyst Deterministic Hex Mark"
>
  <!-- OUTER HEX (BLACK) -->
  <polygon
    points="50 2 93 25 93 75 50 98 7 75 7 25"
    fill="#000000"
  />

  <!-- INNER DETERMINISTIC PATH (BLACK) -->
  <!-- stylised deterministic chevrons -->
  <path
    d="M50 18 L72 30 L50 42 L28 30 Z
       M50 46 L72 58 L50 70 L28 58 Z"
    fill="#000000"
  />

  <!-- DETERMINISTIC DOT (STATE-DRIVEN ONLY) -->
  <circle
    id="det-dot"
    cx="50"
    cy="80"
    r="3.2"
    fill="var(--det-dot-color, #9b5cff)"
  />
</svg>
