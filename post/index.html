<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AMETHYST</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0d12;color:#e6e8ee}
.topbar{display:flex;gap:12px;padding:10px 14px;background:#0f1220;border-bottom:1px solid #222633}
.brand{font-weight:600;color:#c9ccff}
.search{flex:1}
.search input{width:100%;padding:8px;border-radius:6px;border:1px solid #2a2f55;background:#12162a;color:#e6e8ee}
nav{display:flex;gap:18px;padding:10px 14px;background:#12162a;border-bottom:1px solid #222633}
nav a{color:#b7bbd6;text-decoration:none;font-size:13px}
main{padding:24px}
.panel{background:#12162a;border:1px solid #222633;border-radius:10px;padding:14px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2f55;background:#0b0d12;color:#e6e8ee;font-family:ui-monospace,monospace}
textarea{min-height:32vh;line-height:1.4}
.btn{display:inline-block;margin-top:10px;padding:10px 14px;border-radius:10px;background:#1a2150;border:1px solid #2a2f55;color:#fff}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Amethyst</div>
  <div class="search">
    <input placeholder="Aether — SCRY, search, navigate, invoke…" />
  </div>
</header>

<nav>
  <a href="/source/">SOURCE</a>
  <a href="/pipeline/">PIPELINE</a>
  <a href="/guards/">GUARDS</a>
  <a href="/settings/">SETTINGS</a>
</nav>

<main>
<h2>Post</h2>
<p>Publish statements into the public record (mock).</p>

<div class="panel">
  <input placeholder="Title"/>
  <br/><br/>
  <textarea placeholder="Write your post…"></textarea>
  <div class="btn">Commit (mock)</div>
</div>
</main>

</body>
</html>
