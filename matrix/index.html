<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AMETHYST · MATRIX</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0d12;color:#e6e8ee}
.topbar{display:flex;gap:12px;padding:10px 14px;background:#0f1220;border-bottom:1px solid #222633}
.brand{font-weight:600;color:#c9ccff}
.search{flex:1}
.search input{width:100%;padding:8px;border-radius:6px;border:1px solid #2a2f55;background:#12162a;color:#e6e8ee}
nav{display:flex;gap:18px;padding:10px 14px;background:#12162a;border-bottom:1px solid #222633}
nav a{color:#b7bbd6;text-decoration:none;font-size:13px}
main{padding:24px;max-width:900px;margin:0 auto}

.meta{display:flex;gap:16px;color:#b7bbd6;font-size:13px}
.block{border:1px solid #222633;border-radius:10px;padding:14px;margin-top:14px;background:#12162a}
.block textarea{
  width:100%;
  background:#0b0d12;
  color:#e6e8ee;
  border:1px solid #2a2f55;
  border-radius:8px;
  padding:10px;
  font-family:ui-monospace,monospace;
  font-size:14px;
}
.block h3{margin:0 0 8px;font-size:14px;color:#b7bbd6}

.controls{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
button{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #2a2f55;
  background:#1a2150;
  color:#fff;
  cursor:pointer;
}
button.secondary{background:#12162a}

.status{margin-top:10px;font-size:13px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Amethyst</div>
  <div class="search">
    <input placeholder="Aether — SCRY, search, navigate, invoke…" />
  </div>
</header>

<nav>
  <a href="/source/">SOURCE</a>
  <a href="/pipeline/">PIPELINE</a>
  <a href="/guards/">GUARDS</a>
  <a href="/settings/">SETTINGS</a>
</nav>

<main>
<h2>Matrix</h2>

<div class="meta">
  <div id="version"></div>
  <div id="state"></div>
</div>

<div id="blocks"></div>

<div class="controls">
  <button id="addPara">Add Paragraph</button>
  <button id="addHead" class="secondary">Add Heading</button>
  <button id="freezeBtn">Freeze</button>
  <button id="unfreezeBtn" class="secondary">New Version</button>
</div>

<div class="status" id="status"></div>
</main>


<script src="/ui/scry.js"></script>
</body>
</html>
