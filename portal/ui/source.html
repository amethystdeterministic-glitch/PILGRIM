<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Source</title>
  <style>
    body {
      background: #0b0f1a;
      color: #e6e9f0;
      font-family: system-ui, sans-serif;
      padding: 20px;
    }
    .card {
      background: #121833;
      border-radius: 16px;
      padding: 18px;
      margin-top: 14px;
    }
    .label {
      opacity: 0.7;
      font-size: 13px;
      margin-top: 10px;
    }
    .status {
      margin-top: 12px;
      font-size: 15px;
    }
    button {
      background: #1b2340;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      margin-top: 18px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1 id="title">Loading…</h1>
<div id="description"></div>

<div class="card">
  <div class="label">Source ID</div>
  <div id="id"></div>

  <div class="label">Head Hash</div>
  <div id="head"></div>

  <div class="label">Created</div>
  <div id="created"></div>
</div>

<div class="card">
  <strong>Status</strong>
  <div id="status" class="status">Checking status…</div>
</div>

<button onclick="location.href='/'">← Back to Sources</button>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

async function load() {
  // Load basic source info
  const list = await fetch('http://127.0.0.1:9190/api/source/list').then(r => r.json());
  const src = list.sources.find(s => s.id === id);

  document.getElementById('title').innerText = src.title;
  document.getElementById('description').innerText = src.description || '';
  document.getElementById('id').innerText = src.id;
  document.getElementById('head').innerText = src.head;
  document.getElementById('created').innerText = src.created_at;

  // Load status
  try {
    const status = await fetch(
      `http://127.0.0.1:9190/api/source/status?id=${id}`
    ).then(r => r.json());

    if (!status.ok) {
      document.getElementById('status').innerText =
        'Status error: ' + status.error;
      return;
    }

    document.getElementById('status').innerHTML = `
      Ledger height: ${status.ledger.height}<br>
      Head: ${status.ledger.head}<br>
      Guarantees: ${status.guarantees.join(', ')}
    `;
  } catch (e) {
    document.getElementById('status').innerText =
      'Status fetch blocked';
  }
}

load();
</script>

</body>
</html>
