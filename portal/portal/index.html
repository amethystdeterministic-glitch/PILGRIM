<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amethyst Portal</title>
  <style>
    body {
      margin: 0;
      background: #0c0b10;
      color: #e9e7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 600;
    }
    main {
      padding: 20px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: #141320;
      border-radius: 14px;
      padding: 16px;
    }
    pre {
      background: #0b0a14;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<header>Amethyst Portal</header>

<main>
  <div class="card">
    <h3>System</h3>
    <pre id="health">Loading…</pre>
  </div>

  <div class="card">
    <h3>Source Head</h3>
    <pre id="head">Loading…</pre>
  </div>

  <div class="card">
    <h3>Source Verify</h3>
    <pre id="verify">Loading…</pre>
  </div>
</main>

<script>
async function load(id, url) {
  try {
    const r = await fetch(url);
    const j = await r.json();
    document.getElementById(id).textContent = JSON.stringify(j, null, 2);
  } catch {
    document.getElementById(id).textContent = 'Unavailable';
  }
}

load('health', '/health');
load('head', '/source/head');
load('verify', '/source/verify');
</script>

</body>
</html>
