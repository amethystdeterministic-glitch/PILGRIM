<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Source Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      background: #111;
      color: #eee;
    }
    textarea {
      width: 100%;
      height: 50vh;
      background: #000;
      color: #0f0;
      font-family: monospace;
      padding: 12px;
      border: 1px solid #333;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 16px;
    }
    .note {
      opacity: 0.7;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>Source Builder</h1>

<p>Paste or write HTML below. This will become your Source.</p>

<textarea id="html"></textarea>

<button onclick="save()">Create Source</button>

<p class="note">
This writes a new Source locally. No optimisation. No rewriting.
</p>

<script>
function save() {
  const content = document.getElementById('html').value;
  fetch('/create-source', {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: content
  }).then(() => {
    alert('Source created');
  });
}
</script>

</body>
</html>
